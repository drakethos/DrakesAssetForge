name: Release

# One repo, two release trains, picked by tag:
#   app-v1.2.3      → Drakes Asset Forge (desktop TOOL): portable win-x64 zip + Hexium/Gale
#                     Thunderstore-format zip (exe + icon + README/screenshots + manifest, Tools) →
#                     GitHub Release; Hexium upload when PUBLISH_HEXIUM or PUBLISH_HEXIUM_APP is 'true'.
#   runtime-v1.2.3  → Drakes Forge Runtime (BepInEx mod) Thunderstore zip → GitHub Release,
#                     then Thunderstore when PUBLISH_THUNDERSTORE is 'true',
#                     Hexium only when PUBLISH_HEXIUM_RUNTIME is 'true' (occasional — not tied to app tags).
# GitHub releases are created as drafts: review them on the Releases page, then press "Publish release".
# The tag's version must equal <Version> in the project file.
# App Tools packages pin FORGE_RUNTIME_DEP_VERSION (do not bump Runtime just to ship a Tools zip).

on:
  push:
    tags:
      - "app-v*.*.*"
      - "runtime-v*.*.*"

permissions:
  contents: write

env:
  PFHOENIX_VERSION: "1.0.23"
  JOTUNN_VERSION: "2.30.2"
  BEPINEXPACK: "denikson-BepInExPack_Valheim-5.4.2351"
  # Published Runtime the Tools/app package depends on. Bump only when Runtime itself changes.
  FORGE_RUNTIME_DEP_VERSION: "0.4.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Format tests
        run: dotnet test Forge/Format.Tests/Forge.Format.Tests.csproj -c Release

  # ── Desktop app ──────────────────────────────────────────────────────────────
  app:
    if: startsWith(github.ref_name, 'app-v')
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.ver.outputs.version }}
      hexium_zip: ${{ steps.hexium.outputs.zip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check version
        id: ver
        run: |
          $version = "${{ github.ref_name }}" -replace '^app-v', ''
          $project = [regex]::Match((Get-Content Forge/App/Forge.App.csproj -Raw), '<Version>([^<]+)</Version>').Groups[1].Value
          if ($version -ne $project) { Write-Error "Tag ${{ github.ref_name }} doesn't match Forge.App.csproj <Version>$project</Version>"; exit 1 }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Stage game references (Pfhoenix + Jotunn)
        run: ./.github/scripts/stage-refs.ps1

      # The app bundles Forge Runtime (Settings → Install Forge Runtime) and its source (C# mod export).
      - name: Build Forge Runtime
        run: dotnet build Forge/Runtime/Forge.Runtime.csproj -c Release -p:ForgeRefsDir="$env:FORGE_REFS"

      - name: Publish app
        run: |
          # Portable PDB required next to the single-file native host: Hexium/Gale rejects
          # DrakesAssetForge.exe without DrakesAssetForge.pdb ("Native or mixed-mode binary … requires …pdb").
          dotnet publish Forge/App/Forge.App.csproj -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=portable -p:DebugSymbols=true -o dist/app
          # Keep only the exe sidecar PDB; drop huge native/lib PDBs (Skia/HarfBuzz) and satellite PDBs.
          Get-ChildItem dist/app -Recurse -Filter *.pdb |
            Where-Object { $_.Name -ne 'DrakesAssetForge.pdb' } |
            Remove-Item -Force
          if (-not (Test-Path dist/app/runtime/DrakesForgeRuntime.dll)) { Write-Error "Forge Runtime wasn't bundled"; exit 1 }
          if (-not (Test-Path dist/app/DrakesAssetForge.exe)) { Write-Error "DrakesAssetForge.exe missing from publish output"; exit 1 }
          if (-not (Test-Path dist/app/DrakesAssetForge.pdb)) { Write-Error "DrakesAssetForge.pdb missing (required next to exe)"; exit 1 }
          Copy-Item README.md, LICENSE, CHANGELOG.md dist/app/

      - name: Zip portable
        id: zip
        run: |
          $name = "DrakesAssetForge-${{ steps.ver.outputs.version }}-win-x64"
          python -c "import shutil; shutil.make_archive('$name', 'zip', 'dist/app')"
          "zip=$name.zip" >> $env:GITHUB_OUTPUT

      # Thunderstore/Hexium Tools package: distinct from Runtime (DrakesAssetForgeTool + TOOL/.EXE icon).
      - name: Hexium / Gale Tools package
        id: hexium
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $runtimeDep = $env:FORGE_RUNTIME_DEP_VERSION
          $description = "Desktop TOOL (.exe) - Drakes Asset Forge authoring app. Not Forge Runtime. Run DrakesAssetForge.exe to create items/pieces/reskins; publish content packs separately."
          if ($description.Length -gt 256) { Write-Error "description too long ($($description.Length))"; exit 1 }
          New-Item -ItemType Directory -Force pkg-app | Out-Null
          Copy-Item -Path dist/app/* -Destination pkg-app -Recurse -Force
          Copy-Item Forge/App/thunderstore/icon.png, Forge/App/thunderstore/README.md, CHANGELOG.md pkg-app/ -Force
          New-Item -ItemType Directory -Force pkg-app/screenshots | Out-Null
          Copy-Item Forge/App/thunderstore/screenshots/* pkg-app/screenshots/ -Force
          if (-not (Test-Path pkg-app/DrakesAssetForge.exe)) { Write-Error "Hexium package missing DrakesAssetForge.exe"; exit 1 }
          if (-not (Test-Path pkg-app/DrakesAssetForge.pdb)) { Write-Error "Hexium package missing DrakesAssetForge.pdb"; exit 1 }
          if (-not (Test-Path pkg-app/icon.png)) { Write-Error "Hexium package missing icon.png"; exit 1 }
          if (-not (Test-Path pkg-app/screenshots/1-browse.png)) { Write-Error "Hexium package missing screenshots"; exit 1 }
          [ordered]@{
            name = "DrakesAssetForgeTool"
            version_number = $version
            website_url = "https://github.com/${{ github.repository }}"
            description = $description
            dependencies = @(
              "DrakeMods-DrakesForgeRuntime-$runtimeDep",
              "ValheimModding-Jotunn-$env:JOTUNN_VERSION"
            )
          } | ConvertTo-Json | Set-Content pkg-app/manifest.json -Encoding utf8NoBOM
          $zip = "DrakeMods-DrakesAssetForgeTool-$version.zip"
          python -c "import shutil; shutil.make_archive('DrakeMods-DrakesAssetForgeTool-$version', 'zip', 'pkg-app')"
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Drakes Asset Forge ${{ steps.ver.outputs.version }}"
          draft: true
          make_latest: "true"
          files: |
            ${{ steps.zip.outputs.zip }}
            ${{ steps.hexium.outputs.zip }}
          body: |
            ## Drakes Asset Forge ${{ steps.ver.outputs.version }}

            Desktop **TOOL** (`.exe`) to make Valheim items, build pieces and reskins without Unity. Windows, no .NET install needed.
            Content packs / mods you create are separate packages; this zip is the authoring app itself — **not** Forge Runtime.

            ### Portable
            **Download** `${{ steps.zip.outputs.zip }}`, unzip anywhere, run `DrakesAssetForge.exe` (keep `DrakesAssetForge.pdb` beside it).

            ### Hexium / Gale (Tools package)
            Import **`${{ steps.hexium.outputs.zip }}`** (package identity `DrakeMods-DrakesAssetForgeTool`, distinct from `DrakeMods-DrakesForgeRuntime`).
            Gale places it under `BepInEx/plugins/DrakeMods-DrakesAssetForgeTool/` — run `DrakesAssetForge.exe` from there.
            Depends on published **Forge Runtime** `${{ env.FORGE_RUNTIME_DEP_VERSION }}` + Jotunn (Runtime is not re-released with every Tools update).
            Categories: **Tools**, **Valheim 1.0**, **Open Source**.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).

      - uses: actions/upload-artifact@v4
        with:
          name: app-hexium-zip
          path: ${{ steps.hexium.outputs.zip }}
          if-no-files-found: error

  publish-hexium-app:
    needs: app
    if: |
      always()
      && needs.app.result == 'success'
      && (vars.PUBLISH_HEXIUM == 'true' || vars.PUBLISH_HEXIUM_APP == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-hexium-zip
          path: dist
      - name: Publish Tools package to Hexium
        env:
          HEXIUM_TOKEN: ${{ secrets.HEXIUM_TOKEN }}
          ZIP_NAME: ${{ needs.app.outputs.hexium_zip }}
        run: |
          set -euo pipefail
          if [ -z "${HEXIUM_TOKEN}" ]; then
            echo "::error::HEXIUM_TOKEN secret is not set" >&2
            exit 1
          fi
          python3 .github/scripts/publish-hexium.py \
            --file "dist/${ZIP_NAME}" \
            --repository "https://valheim.hexium.gg" \
            --namespace "DrakeMods" \
            --communities "valheim" \
            --categories "Tools,Valheim 1.0,Open Source"

  # ── Forge Runtime (BepInEx mod) ──────────────────────────────────────────────
  runtime:
    if: startsWith(github.ref_name, 'runtime-v')
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.ver.outputs.version }}
      zip: ${{ steps.pkg.outputs.zip }}
      description: ${{ steps.pkg.outputs.description }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check version
        id: ver
        run: |
          $version = "${{ github.ref_name }}" -replace '^runtime-v', ''
          $project = [regex]::Match((Get-Content Forge/Runtime/Forge.Runtime.csproj -Raw), '<Version>([^<]+)</Version>').Groups[1].Value
          $plugin = [regex]::Match((Get-Content Forge/Runtime/ForgeRuntimePlugin.cs -Raw), 'Version = "([^"]+)"').Groups[1].Value
          if ($version -ne $project -or $version -ne $plugin) {
            Write-Error "Tag ${{ github.ref_name }} must match Forge.Runtime.csproj ($project) and ForgeRuntimePlugin.Version ($plugin)"; exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Stage game references (Pfhoenix + Jotunn)
        run: ./.github/scripts/stage-refs.ps1

      - name: Build
        run: dotnet build Forge/Runtime/Forge.Runtime.csproj -c Release -p:ForgeRefsDir="$env:FORGE_REFS"

      - name: Thunderstore package
        id: pkg
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $description = "Loads Forge packs: Valheim items, pieces and reskins made with Drakes Asset Forge, built from your own game files. No asset bundles."
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item Forge/Runtime/bin/Release/DrakesForgeRuntime.dll pkg/
          Copy-Item Forge/Runtime/thunderstore/README.md, Forge/Runtime/thunderstore/CHANGELOG.md, Forge/Runtime/thunderstore/icon.png pkg/
          [ordered]@{
            name = "DrakesForgeRuntime"
            version_number = $version
            website_url = "https://github.com/${{ github.repository }}"
            description = $description
            dependencies = @("$env:BEPINEXPACK", "ValheimModding-Jotunn-$env:JOTUNN_VERSION")
          } | ConvertTo-Json | Set-Content pkg/manifest.json -Encoding utf8NoBOM
          $zip = "DrakeMods-DrakesForgeRuntime-$version.zip"
          python -c "import shutil; shutil.make_archive('DrakeMods-DrakesForgeRuntime-$version', 'zip', 'pkg')"
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "description=$description" >> $env:GITHUB_OUTPUT

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Drakes Forge Runtime ${{ steps.ver.outputs.version }}"
          draft: true
          make_latest: "false"
          files: ${{ steps.pkg.outputs.zip }}
          body: |
            ## Drakes Forge Runtime ${{ steps.ver.outputs.version }}

            The BepInEx mod that loads Forge data packs. Requires Jotunn.

            Import the zip in **Gale**, **r2modman** or **Thunderstore Mod Manager** ("Import local mod"),
            or extract into `BepInEx/plugins/DrakeMods-DrakesForgeRuntime/`.

            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/Forge/Runtime/thunderstore/CHANGELOG.md).

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-zip
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error

  publish-thunderstore:
    needs: runtime
    if: vars.PUBLISH_THUNDERSTORE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: runtime-zip
          path: dist
      - name: Publish to Thunderstore
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          namespace: DrakeMods
          name: DrakesForgeRuntime
          version: ${{ needs.runtime.outputs.version }}
          description: ${{ needs.runtime.outputs.description }}
          community: valheim
          repo: https://thunderstore.io/c/valheim/
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          file: ${{ needs.runtime.outputs.zip }}
          path: dist
          website: https://github.com/${{ github.repository }}
          categories: |
            libraries

  # Runtime Hexium uploads are intentional/occasional — require PUBLISH_HEXIUM_RUNTIME (not the shared app flag).
  publish-hexium-runtime:
    needs: runtime
    if: vars.PUBLISH_HEXIUM_RUNTIME == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runtime-zip
          path: dist
      - name: Publish Runtime to Hexium
        env:
          HEXIUM_TOKEN: ${{ secrets.HEXIUM_TOKEN }}
          ZIP_NAME: ${{ needs.runtime.outputs.zip }}
        run: |
          set -euo pipefail
          if [ -z "${HEXIUM_TOKEN}" ]; then
            echo "::error::HEXIUM_TOKEN secret is not set" >&2
            exit 1
          fi
          python3 .github/scripts/publish-hexium.py \
            --file "dist/${ZIP_NAME}" \
            --repository "https://valheim.hexium.gg" \
            --namespace "DrakeMods" \
            --communities "valheim" \
            --categories "Libraries,Valheim 1.0"
